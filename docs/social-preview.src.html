anywhere in <main>.\"\"\" text = \" | \".join(norm_space(plain(b.text)) for b in ctx.tp.region_blocks(\"main\")) if ctx.lang[\"negation_skip_re\"]: text = ctx.lang[\"negation_skip_re\"].sub(\" \", text) # m\u00fcssen nicht nur is not m\u00fcssen nicht return [(\"blocker\", \"normative\", None, f\"forbidden rendering '{f['form']}': {f['why']}\") for f in ctx.lang.get(\"forbidden\", []) if alt_forms([f[\"form\"]], ctx.lang).search(text)] def _sentence_remainders(blocks: list[MarkedBlock], claims: dict[int, str]) -> dict[int, str]: \"\"\"For each claim id, the text of its page sentence that no claim covers.\"\"\" out = {} for b in blocks: done: dict[tuple[int, int], str] = {} for cid in b.first: span = b.sentence_of(cid) if span and cid not in out: if span not in done: done[span] = b.remainder(span, claims) # one sentence can carry many markers out[cid] = done[span] return out def _model(name: str) -> str: return name.strip().casefold() def check_claims(ctx) -> list[tuple]: \"\"\"Each English claim: translated sentence long enough and present in a <main> block that carries its marker, no text added beside it in its page sentence, same modal sequence, same dates, and a round-2 MATCH back-translation by a different model of the translated sentence and English claim as they stand.\"\"\" out = [] if not ctx.en_sc[\"claims\"]: out.append((\"blocker\", \"claims\", None, \"English sidecar has no claims\")) counts = Counter(c[\"id\"] for c in ctx.tr[\"claims\"]) out += [(\"blocker\", \"claims\", d, \"claim id appears more than once in the translation sidecar\") for d in sorted(i for i, n in counts.items() if n > 1)] by_id = {c[\"id\"]: c[\"sentence\"] for c in ctx.tr[\"claims\"]} en_by_id = {c[\"id\"]: c[\"claim\"] for c in ctx.en_sc[\"claims\"]} latest = {} for r in ctx.tr.get(\"back_translation\", []): if r[\"round\"] >= latest.get(r[\"id\"], {}).get(\"round\", 0): latest[r[\"id\"]] = r tr_blocks = [MarkedBlock(b.text) for b in ctx.tp.region_blocks(\"main\")] en_blocks = [MarkedBlock(b.text) for b in ctx.en.region_blocks(\"main\")] en_rest, tr_rest = _sentence_remainders(en_blocks, en_by_id), _sentence_remainders(tr_blocks, by_id) by_marker: dict[int, list[MarkedBlock]] = {} for b in tr_blocks: for mid in {mid for _, mid in b.marks}: by_marker.setdefault(mid, []).append(b) all_flat = \"\\x00\".join(b.flat for b in tr_blocks) ratio = ctx.lang.get(\"min_length_ratio\", 0.5) for c in ctx.en_sc[\"claims\"]: cid, t = c[\"id\"], by_id.get(c[\"id\"]) if t is None: out.append((\"blocker\", \"claims\", cid, \"claim has no translated sentence in the translation sidecar\")) continue if len(match_norm(t)) < max(6, ratio * len(match_norm(c[\"claim\"]))): out.append((\"blocker\", \"claims\", cid, \"translated sentence is too short to be the claim\")) if not any(b.binds(t, cid) for b in by_marker.get(cid, [])): if match_norm(t) in all_flat: out.append((\"blocker\", \"claims\", cid, f\"marker [{cid}] does not follow the translated sentence in its block\")) else: out.append((\"blocker\", \"claims\", cid, \"translated claim sentence not found in a <main> block\")) ra, rb = en_rest.get(cid, \"\"), tr_rest.get(cid, \"\") if rb and not ra: out.append((\"blocker\", \"claims\", cid, f\"its page sentence has text the English does not: '{rb[:80]}'\")) elif rb and (modal_kinds(ra, ctx.en_lang) != modal_kinds(rb, ctx.lang) or bool(negator_positions(rb, ctx.lang)) != bool(negator_positions(ra, ctx.en_lang))): out.append((\"blocker\", \"normative\", cid, \"the rest of its page sentence has different modals or negation from the English\")) ka, kb = modal_kinds(c[\"claim\"], ctx.en_lang), modal_kinds(t, ctx.lang) if ka != kb: out.append((\"blocker\", \"normative\", cid, f\"modals {ka or 'none'} in English, {kb or 'none'} in the translation\")) da, _ = extract_dates(norm_space(c[\"claim\"]), ctx.en_lang) db, _ = extract_dates(norm_space(nfc(t)), ctx.lang) if da != db: out.append((\"blocker\", \"dates\", cid, f\"dates {da} in English, {db} in the translation\")) r = latest.get(cid) if not r: out.append((\"blocker\", \"back-translation\", cid, \"no back-translation recorded\")) elif r[\"round\"] < 2 or r[\"verdict\"] != \"MATCH\": out.append((\"blocker\", \"back-translation\", cid, f\"latest is round {r['round']} {r['verdict']}; needs round 2 MATCH\")) elif _model(r[\"model\"]) == _model(ctx.tr[\"translator_model\"]): out.append((\"blocker\", \"back-translation\", cid, \"back-translated by the same model that translated\")) elif r.get(\"sentence_sha256\") != sentence_sha256(t): out.append((\"blocker\", \"back-translation\", cid, \"back-translation was made for a different sentence; redo it\")) elif r.get(\"claim_sha256\") != sentence_sha256(c[\"claim\"]): out.append((\"blocker\", \"back-translation\", cid, \"back-translation was made against a different English claim; redo it\")) page_markers = {mid for b in tr_blocks for _, mid in b.marks} for m in sorted(page_markers - set(en_by_id)): out.append((\"blocker\", \"claims\", None, f\"marker [{m}] in the translation has no English claim\")) return out CHECKS = (check_page, check_stale, check_tokens, check_structure, check_forbidden, check_claims) def validate(en_sc: dict, tr: dict) -> None: \"\"\"Raise ValueError when either sidecar does not have the shape the checks read.\"\"\" def need(cond, what): if not cond: raise ValueError(what) need(isinstance(en_sc, dict) and isinstance(en_sc.get(\"article\"), dict), \"English sidecar: article must be an object\") need(isinstance(en_sc.get(\"claims\"), list), \"English sidecar: claims must be a list\") need(len(en_sc[\"claims\"]) <= MAX_CLAIMS and len(tr.get(\"claims\") or []) <= MAX_CLAIMS, f\"more than {MAX_CLAIMS} claims; no article has that many\") for c in en_sc[\"claims\"]: need(isinstance(c, dict) and type(c.get(\"id\")) is int and isinstance(c.get(\"claim\"), str) and len(c[\"claim\"]) <= MAX_SENTENCE_CHARS, f\"English sidecar: each claim needs an int id and a claim string of at most {MAX_SENTENCE_CHARS} characters\") need(isinstance(tr, dict), \"translation sidecar must be an object\") for k in (\"lang\", \"source_body_sha256\", \"translator_model\"): need(isinstance(tr.get(k), str) and tr[k].strip(), f\"translation sidecar: {k} must be a non-empty string\") need(isinstance(tr.get(\"claims\"), list), \"translation sidecar: claims must be a list\") for c in tr[\"claims\"]: need(isinstance(c, dict) and type(c.get(\"id\")) is int and isinstance(c.get(\"sentence\"), str) and len(c[\"sentence\"]) <= MAX_SENTENCE_CHARS, f\"translation sidecar: each claim needs an int id and a sentence string of at most {MAX_SENTENCE_CHARS} characters\") need(isinstance(tr.get(\"back_translation\", []), list), \"translation sidecar: back_translation must be a list\") for r in tr.get(\"back_translation\", []): need(isinstance(r, dict) and type(r.get(\"id\")) is int and type(r.get(\"round\")) is int and isinstance(r.get(\"verdict\"), str) and isinstance(r.get(\"model\"), str) and r[\"model\"].strip(), \"translation sidecar: each back_translation record needs int id and round, verdict and model strings\") class Context: \"\"\"Everything a check reads: both sidecars, both parsed pages, both language files.\"\"\" def __init__(self, en_sc: dict, en_text: str, tr: dict, tr_html: str, lang: dict): self.en_sc, self.en_text, self.tr, self.lang = en_sc, en_text, tr, lang self.en_lang = load_lang(\"en\") self.en, self.tp = parse_page(en_text), parse_page(tr_html) def check(en_sc: dict, en_text: str, tr: dict, tr_html: str, lang: dict) -> list[dict]: \"\"\"Run every check; return findings as dicts with level, check, claim_id and message. en_text is the English file as text, read the way verify_sources.py reads it (universal newlines), so its hash matches the sidecar's body_sha256.\"\"\" validate(en_sc, tr) ctx = Context(en_sc, en_text, tr, tr_html, lang) keys = (\"level\", \"check\", \"claim_id\", \"message\") return [dict(zip(keys, f)) for chk in CHECKS for f in chk(ctx)] def read_capped(path: Path) -> str: \"\"\"Read a regular file once, as text with universal newlines like Path.read_text. Refuses anything that is not a regular file (a FIFO would hang or stream without end), a symlink swapped in after the path was resolved, and anything over MAX_INPUT_BYTES, checked on the open file itself.\"\"\" fd = os.open(path, os.O_RDONLY | getattr(os, \"O_NONBLOCK\", 0) | getattr(os, \"O_NOFOLLOW\", 0)) try: if not stat.S_ISREG(os.fstat(fd).st_mode): raise ValueError(f\"{path} is not a regular file\") with os.fdopen(fd, \"rb\") as f: fd = -1 data = f.read(MAX_INPUT_BYTES + 1) finally: if fd >= 0: os.close(fd) if len(data) > MAX_INPUT_BYTES: raise ValueError(f\"{path} is larger than {MAX_INPUT_BYTES} bytes\") return data.decode(\"utf-8\").replace(\"\\r\\n\", \"\\n\").replace(\"\\r\", \"\\n\") def _inside(root: Path, rel: str) -> Path: \"\"\"Resolve a sidecar path under root; refuse one that escapes it.\"\"\" if not isinstance(rel, str): raise ValueError(f\"path {rel!r} must be a string\") p = (root / rel).resolve() if not p.is_relative_to(root): raise ValueError(f\"{rel} is outside {root}\") return p def run(args) -> tuple[int, str]: \"\"\"Load the inputs, run the checks and render the report; returns (exit code, report).\"\"\" root = Path(args.root).resolve() tr = json.loads(read_capped(Path(args.translation))) if not isinstance(tr, dict): raise ValueError(\"translation sidecar must be an object\") for k in (\"lang\", \"source_sidecar\", \"article\", \"source_body_sha256\", \"translator_model\", \"claims\"): if k not in tr: raise KeyError(k) en_sc = json.loads(read_capped(_inside(root, tr[\"source_sidecar\"]))) validate(en_sc, tr) en_text = read_capped(_inside(root, en_sc[\"article\"][\"path\"])) tr_html = read_capped(_inside(root, tr[\"article\"])) findings = check(en_sc, en_text, tr, tr_html, load_lang(tr[\"lang\"])) blockers = [f for f in findings if f[\"level\"] == \"blocker\"] if args.json: report = json.dumps(findings, ensure_ascii=False, indent=2) else: lines = [f\"Translation check: {tr['article']} ({tr['lang']}) Blockers: {len(blockers)} \" f\"Warnings: {len(findings) - len(blockers)}\"] for f in findings: cid = f\"#{f['claim_id']} \" if f[\"claim_id\"] else \"\" lines.append(f\" [{f['level']}] {f['check']}: {cid}{f['message']}\") report = \"\\n\".join(lines) return (1 if blockers else 0), report def main(argv=None) -> int: \"\"\"CLI: verify_translation.py <translation.json> [--root DIR]. Paths in the JSON are relative to --root.\"\"\" ap = argparse.ArgumentParser(description=__doc__, formatter_class=argparse.RawDescriptionHelpFormatter) ap.add_argument(\"translation\", help=\"<slug>.<lang>.translation.json\") ap.add_argument(\"--root\", default=\".\", help=\"repo root the JSON's paths are relative to\") ap.add_argument(\"--json\", action=\"store_true\", help=\"print findings as JSON\") args = ap.parse_args(argv) try: code, report = run(args) out = sys.stdout if hasattr(out, \"reconfigure\"): out.reconfigure(errors=\"backslashreplace\") print(report, file=out) return code except (OSError, KeyError, TypeError, ValueError, UnicodeError) as exc: print(f\"input error: {exc!r}\".encode(\"ascii\", \"backslashreplace\").decode(), file=sys.stderr) return 2 except Exception as exc: # a crash must never read as a pass or as plain blockers print(f\"script error: {exc!r}\".encode(\"ascii\", \"backslashreplace\").decode(), file=sys.stderr) return 2 if __name__ == \"__main__\": sys.exit(main()) ";const c=document.getElementById('c'),x=c.getContext('2d');
