<title>Choosing a strong password</title>
<meta name="description" content="How long a password should be, and why 15 characters is a good start.">
<meta property="og:image" content="https://example.com/img/password-og.png">
</head>
<body>
<main>
<h1>Choosing a strong password</h1>
<p>Passwords must be at least 15 characters long[1].</p>
<p>You may use a password manager to store them.</p>
<table>
<tr><th>Length</th><th>Time to guess</th></tr>
<tr><td>8 characters</td><td>2 days</td></tr>
<tr><td>15 characters</td><td>400 years</td></tr>
</table>
<p>Run <code>pwgen -s 15</code> to make one, or read <a href="https://example.com/guide">the guide</a>.</p>
<p><img src="/img/chart.png" alt="Chart of guessing time"></p>
</main>
</body>
</html>
