<!doctype html>
<html lang="pt-BR">
<head>
<title>Como escolher uma senha forte</title>
<meta name="description" content="Qual deve ser o tamanho de uma senha, e por que 15 caracteres é um bom começo.">
<meta property="og:image" content="https://example.com/img/pt/password-og.png">
</head>
<body>
<main>
<h1>Como escolher uma senha forte</h1>
<p>As senhas devem ter pelo menos 15 caracteres[1].</p>
<p>Você pode usar um gerenciador de senhas para guardá-las.</p>
<table>
<tr><th>Tamanho</th><th>Tempo para adivinhar</th></tr>
<tr><td>8 caracteres</td><td>2 dias</td></tr>
<tr><td>15 caracteres</td><td>400 anos</td></tr>
</table>
<p>Execute <code>pwgen -s 15</code> para criar uma, ou leia <a href="https://example.com/pt/guide">o guia</a>.</p>
<p><img src="/img/pt/chart.png" alt="Gráfico do tempo para adivinhar"></p>
</main>
</body>
</html>
